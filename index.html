<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding:56px 32px
        }
        .cube{
            width: 170px;
            height: 170px;
            position: relative;
            transition: all 0.3s ease;
        }
        .cube::after{
            content: "hover";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 26px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .c1{
            border-radius: 50%;
            background: linear-gradient(135deg,#ff9a56,#ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c2{
            border-radius: 14px;
            background: linear-gradient(135deg,#39e080,#22c9aa);
            box-shadow: 0 10px 24px rgba(34, 201, 170, 0.35);
        }
        .c3{
            border-radius: 14px;
            background: linear-gradient(135deg,#b49ac0,#7b6899);
            box-shadow: 0 10px 24px rgba(123, 104, 153, 0.35);
        }
        .c4{
            border-radius: 50%;
            background: linear-gradient(135deg,#ffdd70,#ffb378);
            box-shadow: 0 10px 24px rgba(255, 179, 120, 0.35);
        }
        .c5{
            border-radius: 14px;
            background: linear-gradient(135deg,#609978,#467482);
            box-shadow: 0 10px 24px rgba(70, 116, 130, 0.35);
        }
        .c6{
            border-radius: 50%;
            background: linear-gradient(135deg,#c8b2d8,#9982b4);
            box-shadow: 0 10px 24px rgba(153, 130, 180, 0.35);
        }
        .cube:hover{
            transform: translateY(-10px);
            box-shadow: 0 0 24px currentColor;
        }
        .cube:hover::after{
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
